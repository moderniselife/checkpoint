<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Checkpoint</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { --bg:#F5F4FB; --text:#16151F; --muted:#5F5C73; --glass:rgba(255,255,255,.55); --border:rgba(255,255,255,.75); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B0A12; --text:#F2F1F8; --muted:#A6A3BC; --glass:rgba(34,32,52,.5); --border:rgba(255,255,255,.1); } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding:16px; box-sizing:border-box;
    background-image: radial-gradient(50% 50% at 15% 10%, rgba(75,63,209,.35), transparent 70%), radial-gradient(45% 45% at 90% 30%, rgba(43,181,168,.3), transparent 70%); }
  .card { max-width:440px; text-align:center; padding:40px 28px; border-radius:28px; background:var(--glass); border:1px solid var(--border);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); }
  img { width:84px; height:84px; margin:0 auto 18px; display:block; }
  h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.02em; }
  p { margin:0 0 24px; color:var(--muted); }
  a { display:inline-block; padding:12px 20px; border-radius:999px; color:#fff; font-weight:600; text-decoration:none;
    background:linear-gradient(135deg,#4B3FD1,#3E7FD8 55%,#2BB5A8); }
</style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="Checkpoint">
    <h1>This page wandered off.</h1>
    <p>Let's get you back to turning tickets into test plans.</p>
    <a href="/">Back to Checkpoint</a>
  </main>
</body>
</html>
