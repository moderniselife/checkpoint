name: Checkpoint
options:
  bundleIdPrefix: com.josephshenton
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: TA44L322R3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Checkpoint:
    type: application
    platform: macOS
    sources:
      - Checkpoint
    info:
      path: Checkpoint/Info.plist
      properties:
        CFBundleDisplayName: Checkpoint
        LSApplicationCategoryType: public.app-category.developer-tools
        # Local model servers (Ollama, LM Studio…) are plain http://localhost; remote stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: ""
        # Set to an iCloud container in signed builds; empty keeps iCloud sync off.
        CheckpointCloudKitContainer: $(CHECKPOINT_CLOUDKIT_CONTAINER)
    entitlements:
      path: Checkpoint/Checkpoint.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        # Read-write so plans can be exported to a file the user picks; the codebase bookmark stays read-only.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephshenton.checkpoint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CHECKPOINT_CLOUDKIT_CONTAINER: ""

  CheckpointMobile:
    type: application
    platform: iOS
    sources:
      - path: Checkpoint
        excludes:
          - "App/**"
          - "Info.plist"
          - "Checkpoint.entitlements"
          - "Assets.xcassets/**"
          - "Views/MiniPanel.swift"
      - CheckpointMobile
    info:
      path: CheckpointMobile/Info.plist
      properties:
        CFBundleDisplayName: Checkpoint
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Checkpoint can talk to an AI model server running on your local network, like Ollama or LM Studio.
        NSCameraUsageDescription: Take photos of what you see while testing and attach them to a task as evidence.
        # Continued-processing tasks keep an analysis going after you leave the app.
        BGTaskSchedulerPermittedIdentifiers: ["com.josephshenton.checkpoint.analyze.*"]
        ITSAppUsesNonExemptEncryption: false
        # Set to an iCloud container (e.g. iCloud.com.josephshenton.checkpoint) in signed App Store builds; empty keeps iCloud sync off.
        CheckpointCloudKitContainer: $(CHECKPOINT_CLOUDKIT_CONTAINER)
    settings:
      base:
        PRODUCT_NAME: Checkpoint
        PRODUCT_BUNDLE_IDENTIFIER: com.josephshenton.checkpoint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CHECKPOINT_CLOUDKIT_CONTAINER: ""
